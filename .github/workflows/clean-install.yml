# Installs a Shinoque candidate on a brand-new Windows machine, exactly as a
# tester would, and fails unless the app starts and its engine answers.
# Optionally installs an earlier release first, so the upgrade path is tested
# too. Candidates are pre-releases, which installed apps never update to.
name: clean-install

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release tag holding the candidate Setup.exe (a pre-release)
        required: true
      previous:
        description: Optional earlier release tag to install first (upgrade test)
        required: false
        default: ""
      networking:
        description: WSL networking mode (nat, or mirrored as some testers use)
        required: false
        default: nat
      installer:
        description: Which Setup.exe (x64, or arm64 = the ARM installer, which an x64 runner must refuse)
        required: false
        default: x64
      runner:
        description: Machine type (windows-2025 x64, or windows-11-arm)
        required: false
        default: windows-2025
      busy_ports:
        description: Ports another program holds before install, comma-separated (e.g. 47800); Shinoque must move
        required: false
        default: ""
      dev_folder:
        description: Also check the installer refuses a developer folder (0.2.6 and later)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Ubuntu 24.04 on WSL2 like a tester's PC
        shell: pwsh
        run: ./.github/scripts/prepare-wsl.ps1 -Networking "${{ inputs.networking }}"

      - name: The ARM installer refuses an x64 PC
        if: ${{ inputs.installer == 'arm64' && inputs.runner != 'windows-11-arm' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/arm64-refused.ps1 -Tag "${{ inputs.candidate }}"

      - name: The installer refuses a developer build's folder
        if: ${{ inputs.dev_folder && inputs.previous == '' && inputs.installer != 'arm64' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/dev-folder-refused.ps1 -Tag "${{ inputs.candidate }}" -Asset "${{ inputs.installer }}"

      - name: Another program holds ports Shinoque would use
        if: ${{ inputs.busy_ports != '' }}
        shell: pwsh
        run: ./.github/scripts/hold-ports.ps1 -Ports "${{ inputs.busy_ports }}"

      - name: Install the previous release first
        if: ${{ inputs.previous != '' && inputs.installer != 'arm64' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/install-and-start.ps1 -Tag "${{ inputs.previous }}" -Mode previous -Asset "${{ inputs.installer }}"

      - name: Install and start the candidate
        if: ${{ inputs.installer != 'arm64' || inputs.runner == 'windows-11-arm' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/install-and-start.ps1 -Tag "${{ inputs.candidate }}" -Mode ${{ inputs.previous != '' && 'update' || 'fresh' }} -Asset "${{ inputs.installer }}"

      - name: Probe Windows-to-WSL routes
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/probe-routes.ps1

      - name: Collect evidence
        if: always()
        shell: pwsh
        run: ./.github/scripts/collect-evidence.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-evidence
          path: evidence
